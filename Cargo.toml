[package]
name = "tree-sitter-irules"
description = "F5 iRules grammar for the tree-sitter parsing library"
version = "0.1.1"
keywords = ["incremental", "parsing", "irules", "tcl", "f5"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/dekobon/tree-sitter-irules"
edition = "2024"
rust-version = "1.94"
license = "MIT"

build = "bindings/rust/build.rs"
include = [
  "/LICENSE",
  "bindings/rust/**",
  "/grammar.js",
  "queries/*",
  "src/*",
  "test/stress/**",
]

[lib]
path = "bindings/rust/lib.rs"

[[test]]
name = "parse_stress"
path = "bindings/rust/tests/parse_stress.rs"

[dependencies]
tree-sitter-language = "0.1.7"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27"

# Lint posture. No crate-wide allows — additional allows go at file or
# function level so the carve-out stays visible at the affected site
# rather than weakening the whole crate.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
