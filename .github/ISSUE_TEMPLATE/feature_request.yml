name: Feature request
description: Suggest a new grammar rule, query capture, or binding feature
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: >-
        What iRules syntax or feature is missing or incorrect?
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Example iRules code
      description: >-
        A code sample that should parse but doesn't, or that produces
        the wrong tree shape.
      render: tcl
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: >-
        What parse tree or highlight result should this produce?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: >-
        Links to the F5 iRules documentation
        (https://clouddocs.f5.com/api/irules/), upstream TCL behavior,
        related issues, or editor integration details.
