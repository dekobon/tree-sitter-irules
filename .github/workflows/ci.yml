name: CI

# Third-party actions (anything outside `actions/*` and `github/*`)
# are pinned to a commit SHA with a trailing `# vN` comment.
# Floating tags or branches would let an upstream owner change
# behavior silently. Dependabot still bumps these because the
# version comment is in the format it recognizes.

on:
  push:
    branches: [main]
    paths: &paths
      - .github/workflows/**
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - queries/**
      - binding.gyp
      - package.json
      - package-lock.json
      - eslint.config.mjs
      - Cargo.toml
      - Cargo.lock
      - go.mod
      - go.sum
      - pyproject.toml
      - setup.py
      - Package.swift
      - tree-sitter.json
      - .taplo.toml
      - .typos.toml
      - deny.toml
      - .markdownlint-cli2.jsonc
      - "**/*.md"
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint source code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 20 went EOL in April 2026; 24 is the current active
          # LTS. eslint 10 requires ^20.19.0 || ^22.13.0 || >=24.
          node-version: 24
      - run: npm ci
      - run: npm run lint

  test:
    name: Run tests
    runs-on: ${{matrix.os}}
    # The real suite finishes in a couple of minutes; cap the job so a hung
    # run fails fast instead of burning billable minutes to the 6h default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Resolve tree-sitter-cli version from package-lock.json
        id: ts-cli
        shell: bash
        run: |-
          version=$(jq -r '.packages["node_modules/tree-sitter-cli"].version' package-lock.json)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "tree-sitter-cli not found in package-lock.json" >&2
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "tree-sitter-cli version '$version' is not a valid SemVer string" >&2
            exit 1
          fi
          printf 'ref=v%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: tree-sitter/setup-action/cli@faab9a23fa6195da0f1cf868219cc1e89f238d3d # v2
        with:
          tree-sitter-ref: ${{ steps.ts-cli.outputs.ref }}
      - uses: tree-sitter/parser-test-action@92e35c06b51ea26c80ffbd3cc8d9286d9110df17 # v3
        with:
          generate: true
          test-parser: true
          test-rust: true
          rust-version: "1.94"
          # test-node: true

  rust-lint:
    name: Rust lint (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.94"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --all-targets -- -D warnings

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features

  tooling:
    name: Repo tooling checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: typos
        uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2
      - name: taplo (TOML format check)
        uses: uncenter/setup-taplo@b18c8c8302695fe63d6853bc004006215ac52b91 # v2
        with:
          # Pinned rather than `latest` so a taplo release cannot change
          # the formatting verdict without a deliberate bump here.
          # setup-taplo v2 is required for taplo >= 0.10.0 (v1 only
          # knows the taplo-full-* asset names, which stop at 0.9.3).
          version: "0.10.0"
      - run: taplo format --check
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  fuzz:
    name: Fuzz parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check for scanner changes
        id: scanner-changes
        run: |-
          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ -- src/scanner.c; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: tree-sitter/fuzz-action@6a1dcff00aefd038ba418bd63732a9add4901266 # v4
        if: steps.scanner-changes.outputs.changed == 'true'

  python-sdist:
    name: Python sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build
      # With no flags, `build` makes the sdist and then builds the wheel
      # from that sdist, so a file missing from the sdist fails here.
      - run: python -m build
      # Expected files come from the checkout, so a new query file is
      # required automatically.
      - name: Check sdist and wheel contents
        shell: python
        run: |
          import glob
          import os
          import sys
          import tarfile
          import zipfile

          headers = set(glob.glob("src/tree_sitter/*.h"))
          queries = {p for p in glob.glob("queries/**/*", recursive=True) if os.path.isfile(p)}
          if not headers or not queries:
              sys.exit("No headers or queries found in the checkout; update this check.")

          (sdist,) = glob.glob("dist/*.tar.gz")
          (wheel,) = glob.glob("dist/*.whl")
          with tarfile.open(sdist) as tf:
              in_sdist = {n.split("/", 1)[1] for n in tf.getnames() if "/" in n}
          with zipfile.ZipFile(wheel) as zf:
              in_wheel = set(zf.namelist())

          problems = [f"missing from sdist: {p}" for p in sorted((headers | queries) - in_sdist)]
          problems += [
              f"missing from wheel: {p}"
              for p in sorted({f"tree_sitter_irules/{q}" for q in queries} - in_wheel)
          ]
          problems += [f"C source in wheel: {n}" for n in sorted(in_wheel) if n.endswith(".c")]
          if problems:
              sys.exit("Python distribution check failed:\n  " + "\n  ".join(problems))
          print(f"OK: {len(headers)} headers and {len(queries)} query files packaged, no C sources in the wheel")
      - run: python -m pip install "$(ls dist/*.whl)[core]"
      # An explicit file rather than `discover`: on 3.11, `discover`
      # exits 0 when it finds no tests.
      - run: python -m unittest -v bindings/python/tests/test_binding.py
