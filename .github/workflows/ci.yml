name: CI

# Third-party actions (anything outside `actions/*` and `github/*`)
# are pinned to a commit SHA with a trailing `# vN` comment.
# Floating tags or branches would let an upstream owner change
# behavior silently. Dependabot still bumps these because the
# version comment is in the format it recognizes.

on:
  push:
    branches: [main]
    paths: &paths
      - .github/workflows/**
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - queries/**
      - binding.gyp
      - package.json
      - package-lock.json
      - eslint.config.mjs
      - Cargo.toml
      - Cargo.lock
      - go.mod
      - go.sum
      - pyproject.toml
      - setup.py
      - Package.swift
      - tree-sitter.json
      - .taplo.toml
      - .typos.toml
      - deny.toml
      - .markdownlint-cli2.jsonc
      - "**/*.md"
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint source code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 20 went EOL in April 2026; 24 is the current active
          # LTS. eslint 10 requires ^20.19.0 || ^22.13.0 || >=24.
          node-version: 24
      - run: npm ci
      - run: npm run lint

  test:
    name: Run tests
    runs-on: ${{matrix.os}}
    # The real suite finishes in a couple of minutes; cap the job so a hung
    # run fails fast instead of burning billable minutes to the 6h default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v7
      - name: Resolve tree-sitter-cli version from package-lock.json
        id: ts-cli
        shell: bash
        run: |-
          version=$(jq -r '.packages["node_modules/tree-sitter-cli"].version' package-lock.json)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "tree-sitter-cli not found in package-lock.json" >&2
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "tree-sitter-cli version '$version' is not a valid SemVer string" >&2
            exit 1
          fi
          printf 'ref=v%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: tree-sitter/setup-action/cli@49f8c1f20b60102eae8c033bb7c7f6cd056f6086 # v2
        with:
          tree-sitter-ref: ${{ steps.ts-cli.outputs.ref }}
      - uses: tree-sitter/parser-test-action@aba4a3de737f86f8ce83be38166a1ab521d4c960 # v2
        with:
          generate: true
          test-parser: true
          test-rust: true
          rust-version: "1.94"
          # test-node: true
      # Catch a committed parser.c / grammar.json / node-types.json
      # that drifted from grammar.js. The parser-test-action above
      # regenerates these in-place but never compares them against the
      # checkout, so a stale committed copy can pass tests while
      # shipping out-of-date C to downstream consumers. Linux only —
      # line-ending normalization on Windows produces spurious diffs.
      - name: Verify generated parser artifacts are up to date
        if: runner.os == 'Linux'
        shell: bash
        run: |-
          set -eu
          if ! git diff --exit-code src/parser.c src/grammar.json src/node-types.json; then
            echo "Committed parser artifacts are stale. Run 'npx tree-sitter generate' and commit the result." >&2
            exit 1
          fi

  rust-lint:
    name: Rust lint (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.94"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --all-targets -- -D warnings

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features

  tooling:
    name: Repo tooling checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: typos
        uses: crate-ci/typos@4d9c206a77c041268485162b8e2579ad7a5cb9a3 # v1.50.0
      - name: taplo (TOML format check)
        uses: uncenter/setup-taplo@b18c8c8302695fe63d6853bc004006215ac52b91 # v2
        with:
          # Pinned rather than `latest` so a taplo release cannot change
          # the formatting verdict without a deliberate bump here.
          # setup-taplo v2 is required for taplo >= 0.10.0 (v1 only
          # knows the taplo-full-* asset names, which stop at 0.9.3).
          version: "0.10.0"
      - run: taplo format --check
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          globs: "**/*.md"

  fuzz:
    name: Fuzz parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check for scanner changes
        id: scanner-changes
        run: |-
          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ -- src/scanner.c; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: tree-sitter/fuzz-action@6a1dcff00aefd038ba418bd63732a9add4901266 # v4
        if: steps.scanner-changes.outputs.changed == 'true'
